# Optional Linux host networking for native WebRTC cameras.
# Set COMPOSE_FILE=docker-compose.yml:docker-compose.telegram-lan.yml in .env.
# PostgreSQL/Redis are published only on loopback, never on the LAN.
services:
  bot:
    network_mode: host
    environment:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: ${TELEGRAM_DB_PORT:-15432}
      REDIS_URL: redis://127.0.0.1:${TELEGRAM_REDIS_PORT:-16379}/0

  db:
    ports:
      - "127.0.0.1:${TELEGRAM_DB_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${TELEGRAM_REDIS_PORT:-16379}:6379"
