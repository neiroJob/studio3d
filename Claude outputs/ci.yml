name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер
        run: ruff check .
      - name: Миграции не забыты
        run: python manage.py makemigrations --check --dry-run
        env:
          STUDIO3D_TESTING: "1"
      - name: Тесты
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci/; s/^DATABASE_PASSWORD=.*/DATABASE_PASSWORD=ci/' .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Сборка и запуск
        run: |
          mkdir -p backups
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost/healthz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost/ | grep -E "^(200|302)$"
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs
