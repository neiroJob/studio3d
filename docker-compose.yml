# Студия 3D — основной файл запуска.
# Запуск:     docker compose up -d --build
# Остановка:  docker compose down
# Настройки берутся из .env (шаблон — .env.example).

name: studio3d

services:
  web:
    build: ./web
    image: studio3d-web:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /backups
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-studio3d}
      POSTGRES_USER: ${DATABASE_USER:-studio3d}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Задайте DATABASE_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DATABASE_NAME:-studio3d}
      PGUSER: ${DATABASE_USER:-studio3d}
      PGPASSWORD: ${DATABASE_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TIME_ZONE:-Europe/Moscow}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  static:
  media:
