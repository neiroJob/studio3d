<!doctype html>
<html lang="ru">
<head>{% include "_head.html" %}<title>Вход — {{ studio_name }}</title></head>
<body>
<div class="center">
  <form class="login-card" method="post" novalidate>
    {% csrf_token %}
    {% include "_brand.html" %}
    <h1>Вход</h1>
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field" for="id_username"><span>Логин</span>
      <input id="id_username" name="username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}"></label>
    <label class="field" for="id_password"><span>Пароль</span>
      <span class="pass-wrap"><input id="id_password" type="password" name="password" autocomplete="current-password" required><button type="button" data-show-pass>показать</button></span></label>
    <label class="check"><input type="checkbox" name="remember" {% if form.remember.value %}checked{% endif %}> Запомнить меня на этом устройстве</label>
    <div class="err" role="alert">{{ error }}</div>
    <button class="btn pri" type="submit">Войти</button>
    <p class="small muted" style="margin:14px 0 0">Забыли пароль? Его сбрасывает администратор студии.</p>
  </form>
</div>
</body>
</html>
