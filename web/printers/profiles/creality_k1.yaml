# Профиль модели. Справочник полей — web/printers/profiles.py.
# Проверено на реальном принтере 2026-10-28: WebSocket 9999 (нет Moonraker, порт 7125 закрыт),
# прошивка DWIN sw ver:1.3.5.22. Команды pause/resume/stop/lightSw и загрузка/удаление файла
# отправлены и подтверждены ответом принтера. Запуск печати (printprt:) взят из собственного
# JS принтера, но не запускался «вживую». Протокол — драйвер creality_native, докстринг там же.
id: creality_k1
manufacturer: Creality
model: K1
driver: creality_native
verified: true

connection:
  # Это не HTTP-порт: у K1 нет Moonraker, все команды и состояние идут через один WebSocket.
  port: 9999

# Паспортная мощность, Вт. Нет проверенных данных — пользователь вводит свою.
power_w: null

build_volume_mm: [220, 220, 250]

camera:
  type: none

capabilities: [pause, resume, cancel, light, start_file, upload, delete_file, rename_file]

light:
  object: lightSw
  on_gcode: "lightSw=1"
  off_gcode: "lightSw=0"

tools: 1
